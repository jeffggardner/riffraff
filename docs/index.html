<title>just us riffraff hanging out</title>
<script data-goatcounter="https://riffraff.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root {
    --charcoal: #141210;
    --offwhite: #F2EDE4;
    --amber: #FFB000;
    --violet: #6E5A7E;
    --sage: #8A9B8E;
    --dusk-blue: #7BA3C0;
    --bright-blue: #00BFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--charcoal);
    color: var(--offwhite);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.4;
  }
  h1, h2, .display {
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  header {
    padding: 1.25rem 1.5rem 0.75rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: sticky;
    top: 0;
    background-color: var(--charcoal);

    /*
    background-image: linear-gradient(rgba(20,18,16,0.8), rgba(20,18,16,0.92)), url('');
    background-size: cover, 854px 540px;
    background-position: right, bottom;
    background-repeat: no-repeat, no-repeat;
    */

    z-index: 10;
    transition: transform .7s ease;
  }
  @media (max-width: 767px) {
    header.header-hidden { transform: translateY(-100%); }
  }
  header .inner { max-width: 900px; margin: 0 auto; }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 0 0.75rem;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    font-size: 1.2rem;
    color: var(--sage);
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.75rem; color: var(--offwhite); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
  }
  input[type="search"], select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--offwhite);
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  input[type="search"] { flex: 1 1 220px; }
  input[type="search"]::placeholder { color: rgba(242,237,228,0.4); }
  select { flex: 0 0 auto; }
  input[type="search"]:focus, select:focus {
    outline: none;
    border-color: var(--amber);
  }
  /*
    Soundwave watermark: fixed so it stays put while the page scrolls, and
    painted between the body background and the content (which sits at
    z-index 1+). pointer-events: none keeps it from eating clicks, and
    screen blending makes the thin strokes glow against the charcoal.
  */
  .watermark {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.95;
  }
  .watermark svg { width: 100%; height: 46vh; }
  /*
    The listings sit on a near-opaque charcoal panel so the waves stay bright
    in the margins without washing out the text on top of them.
  */
  main {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 8rem;
    background: rgba(20,18,16,0.94);
    border-left: 1px solid rgba(255,255,255,0.07);
    border-right: 1px solid rgba(255,255,255,0.07);
  }
  /*
    Each day is a section with a narrow rail on the left holding the date
    rotated 90° (vertical-rl), so the date stays pinned in view for the whole
    run of that day's events while costing ~2rem of horizontal space.
  */
  .day {
    display: flex;
    align-items: stretch;
    gap: 0.9rem;
    margin-top: 2rem;
    min-height: 8rem; /* keeps a one-event day tall enough for the rotated date */
  }
  .day:first-child { margin-top: 0; }
  .day-rail {
    flex: 0 0 1.6rem;
    margin: 0;
    border-right: 1px solid rgba(255,176,0,0.25);
  }
  /*
    Collapsed, there are no events to run alongside, so the rail stops being a
    rail: it flips back to horizontal type and spans the full row as a bar.
  */
  .day.collapsed {
    min-height: 0;
    margin-top: 0.6rem;
  }
  .day.collapsed .day-rail {
    flex: 1 1 auto;
    border-right: none;
    border-bottom: 1px solid rgba(255,176,0,0.25);
  }
  .day.collapsed .day-heading {
    position: static;
    writing-mode: horizontal-tb;
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.3rem 0.4rem;
  }
  /* The rail doubles as the collapse toggle; it's the only tap target per day. */
  .day-heading {
    position: sticky;
    top: calc(var(--header-h, 0px) + 0.75rem);
    display: block;
    width: 100%;
    margin: 0;
    padding: 0.35rem 0;
    background: none;
    border: none;
    border-radius: 4px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    cursor: pointer;
    text-align: start;
  }
  .day-heading:hover { background: rgba(255,176,0,0.12); }
  .day-heading:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .day-count {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--sage);
    margin-top: 0.5rem;
  }
  .day.collapsed .day-count { margin-top: 0; }
  .day:not(.collapsed) .day-count { display: none; }
  .day-events { flex: 1 1 auto; min-width: 0; }
  .day-events article.event:last-child { border-bottom: none; }
  .day.collapsed .day-events { display: none; }
  @media (max-width: 767px) {
    .day { gap: 0.7rem; }
    .day-heading { font-size: 1rem; }
    /* Header slides away on mobile scroll, so drop its offset when hidden. */
    header.header-hidden ~ main { --header-h: 0px; }
  }
  article.event {
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 1.1rem 0;
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .event .main { flex: 1 1 320px; min-width: 0; }
  .event h3 {
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 0.15rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .az-badge {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--amber);
    border: 1px solid rgba(255,176,0,0.4);
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    white-space: nowrap;
  }
  .spotify-link {
    display: inline-flex;
    align-items: center;
    color: #1DB954;
    flex: 0 0 auto;
  }
  .spotify-link:hover { filter: brightness(1.25); }
  .spotify-link svg { width: 15px; height: 15px; fill: currentColor; }
  .instagram-link {
    display: inline-flex;
    align-items: center;
    color: #E1306C;
    flex: 0 0 auto;
  }
  .instagram-link:hover { filter: brightness(1.25); }
  .instagram-link svg { width: 15px; height: 15px; fill: currentColor; }
  button.pill-toggle {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--amber);
    background: transparent;
    border: 1px solid rgba(255,176,0,0.4);
    border-radius: 999px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  button.pill-toggle:hover { background: rgba(255,176,0,0.1); }
  button.pill-toggle.active { background: var(--amber); color: var(--charcoal); border-color: var(--amber); }
  .date-filters { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.375rem; }
  .meta { color: var(--bright-blue); font-size: 1.05rem; margin: 0 0 0.2rem; }
  .venue-link { color: inherit; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
  .venue-link:hover { text-decoration-color: currentColor; }
  .summary { color: rgba(242,237,228,0.6); font-size: 0.95rem; margin: 0; }
  .guests { margin: 0.5rem 0 0; }
  .guests-label {
    color: var(--dusk-blue);
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin: 0 0 0.3rem;
  }
  .guests-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
  .guests-list li { display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; color: var(--dusk-blue); }
  .festival-name-line {
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    margin: 0 0 0.3rem;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .festival-name-line a { color: inherit; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
  .festival-name-line a:hover { text-decoration-color: currentColor; }
  .festival-dates { color: var(--sage); font-size: 0.9rem; font-weight: 400; font-family: 'Inter', system-ui, sans-serif; }
  .festival-venues { color: var(--bright-blue); font-size: 0.95rem; margin: 0 0 0.75rem; }
  .festival-venues a { color: inherit; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
  .festival-venues a:hover { text-decoration-color: currentColor; }
  .festival-venues .sep { color: var(--sage); margin: 0 0.15rem; }
  .festival-artists {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.35rem 1.5rem;
  }
  @media (max-width: 640px) {
    .festival-artists { grid-template-columns: 1fr; }
  }
  .festival-artist { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--offwhite); }
  .festival-artist .az-badge { flex: 0 0 auto; }
  .side {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-left: auto;
  }
  .price { color: var(--sage); font-size: 0.85rem; white-space: nowrap; }
  a.tickets {
    color: var(--offwhite);
    font-size: 0.85rem;
    text-decoration: underline;
    text-decoration-color: rgba(138,155,142,0.6);
    text-underline-offset: 3px;
    white-space: nowrap;
  }
  a.tickets:hover { color: var(--amber); text-decoration-color: var(--amber); }
  a.gcal {
    color: var(--offwhite);
    font-size: 0.85rem;
    text-decoration: underline;
    text-decoration-color: rgba(138,155,142,0.6);
    text-underline-offset: 3px;
    white-space: nowrap;
  }
  a.gcal:hover { color: var(--amber); text-decoration-color: var(--amber); }
  .empty { color: var(--sage); padding: 3rem 0; text-align: center; }
  .count { color: var(--sage); font-size: 0.8rem; margin-top: 1rem; }
  .ticker {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.9rem 1.5rem 0;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .ticker-label {
    flex: 0 0 auto;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--amber);
    white-space: nowrap;
  }
  .ticker-viewport {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    mask-image: linear-gradient(to right, transparent, black 24px, black calc(100% - 24px), transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 24px, black calc(100% - 24px), transparent);
  }
  .ticker-track {
    display: inline-flex;
    gap: 2.5rem;
    animation: ticker-scroll var(--ticker-duration, 40s) linear infinite;
  }
  .ticker-viewport:hover .ticker-track,
  .ticker-viewport:focus-within .ticker-track {
    animation-play-state: paused;
  }
  .ticker-item {
    color: var(--offwhite);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .ticker-item:hover, .ticker-item:focus-visible {
    color: var(--amber);
  }
  .ticker-item .ticker-sep { color: var(--sage); margin: 0 0.15rem; }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
    .ticker-viewport { overflow-x: auto; }
  }
  .ticker-viewport--static { overflow-x: auto; }
  .ticker-viewport--static .ticker-track { animation: none; }
  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: var(--charcoal);
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 10;
  }
  footer {
    max-width: 860px;
    margin: 0 auto;
    padding: 0.6rem 1.5rem 0.75rem;
    color: rgba(242,237,228,0.35);
    font-size: 0.75rem;
    display: flex;
    justify-content: flex-end;
  }
  footer .updated { text-align: right; white-space: nowrap; }

  /* Two-panel tabs: Shows and the weekly releases feed. */
  .tabs { display: flex; gap: 0.5rem; margin: 0 0 0.6rem; }
  .tab {
    flex: 1 1 0;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--amber); background: transparent; border: 1px solid rgba(255,176,0,0.4);
    border-radius: 999px; padding: 0.5rem 0.6rem; min-height: 36px; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { background: rgba(255,176,0,0.1); }
  .tab.active { background: var(--amber); color: var(--charcoal); border-color: var(--amber); }
  @media (min-width: 768px) { .tabs { max-width: 420px; } }

  /* Matches the h1's blue and display face; h1/h2 supplies Barlow Condensed 700. */
  .releases-subtitle {
    color: var(--bright-blue);
    font-size: 1.5rem;
    margin: 0 0 1rem;
  }
  article.release { display: flex; gap: 0.8rem; align-items: flex-start;
    padding: 0.85rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
  article.release:last-child { border-bottom: none; }
  .cover-link { flex: 0 0 auto; display: block; line-height: 0; border-radius: 4px; }
  .cover-link:hover .cover, .cover-link:focus-visible .cover { filter: brightness(1.15); }
  .cover-link:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .cover { display: block; width: 64px; height: 64px; border-radius: 4px; object-fit: cover;
    background: rgba(255,255,255,0.06); }
  .release-main { flex: 1 1 auto; min-width: 0; }
  article.release h3 { font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-size: 1.15rem; font-weight: 600; margin: 0 0 0.1rem; }
  .release-artist { color: var(--bright-blue); font-size: 1rem; margin: 0 0 0.3rem;
    display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .release-meta { color: var(--sage); font-size: 0.78rem; margin: 0; text-transform: uppercase;
    letter-spacing: 0.06em; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .type-badge { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.05em; color: var(--amber);
    border: 1px solid rgba(255,176,0,0.4); border-radius: 999px; padding: 0.1rem 0.5rem; white-space: nowrap; }

  /*
    Mobile header compaction. The header is sticky, and at phone widths its
    controls were stacking one per row and taking over half the viewport
    before a single event was visible. Everything below is about fitting the
    same controls into fewer rows rather than shrinking the controls: the
    pills get a min-height so pairing them up doesn't leave them shorter than
    they were when each had a row to itself.
  */
  @media (max-width: 767px) {
    header { padding: 0.75rem 1rem 0.6rem; }
    /* 0.35em tracking wrapped the brand onto two lines at this width. */
    .brand { font-size: 0.72rem; letter-spacing: 0.16em; margin-bottom: 0.35rem; }
    h1 { font-size: 1.15rem; margin-bottom: 0.6rem; }
    .releases-subtitle { font-size: 1.3rem; }

    /* Row 1: search and the local-bands toggle, side by side. */
    .controls { gap: 0.5rem; }
    input[type="search"] { flex: 1 1 auto; min-width: 0; }
    #azToggle { flex: 0 0 auto; padding: 0.5rem 0.7rem; font-size: 0.65rem; min-height: 36px; }

    /* Rows 2-3: the two selects, then the two remaining date filters. */
    .date-filters { gap: 0.5rem; margin-top: 0.5rem; }
    .date-filters select,
    .date-filters button.pill-toggle { flex: 1 1 calc(50% - 0.25rem); min-width: 0; }
    .date-filters button.pill-toggle { padding: 0.5rem 0.4rem; min-height: 36px; }

    /*
      Hidden on mobile only: each cost a full row, and both are reachable by
      other means — "tomorrow" is the top of the list anyway, and "this month"
      is close to the unfiltered view. Desktop has the room, so it keeps them.
    */
    .date-filters button[data-date="tomorrow"],
    .date-filters button[data-date="month"] { display: none; }
  }
</style>

  // Collapse/expand the header as the user scrolls down/up, mobile only
  // (CSS also gates the transform behind the same max-width breakpoint).
  (function () {
    const header = document.querySelector('header');
    const mql = window.matchMedia('(max-width: 767px)');
    const SCROLL_DELTA_THRESHOLD = 12;
    let lastY = window.scrollY;
    let ticking = false;

    function update() {
      ticking = false;
      if (!mql.matches) {
        header.classList.remove('header-hidden');
        lastY = window.scrollY;
        return;
      }
      const y = window.scrollY;
      const delta = y - lastY;
      if (y < 64) {
        header.classList.remove('header-hidden');
      } else if (delta > SCROLL_DELTA_THRESHOLD) {
        header.classList.add('header-hidden');
      } 
      // leave this off temporarily
      // else if (delta < (SCROLL_DELTA_THRESHOLD * -5)) {
      //   header.classList.remove('header-hidden');
      // }
      lastY = y;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(update);
      }
    }, { passive: true });
    mql.addEventListener('change', () => header.classList.remove('header-hidden'));

    // The sticky day rail pins below the sticky header, whose height varies
    // with viewport width (controls wrap), so publish it as a CSS variable.
    const setHeaderHeight = () =>
      document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
    setHeaderHeight();
    if (window.ResizeObserver) new ResizeObserver(setHeaderHeight).observe(header);
    else window.addEventListener('resize', setHeaderHeight);
  })();

  function dayKey(iso) {
    return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/Phoenix' });
  }
  function daysBetween(fromKey, toKey) {
    return Math.round((Date.parse(toKey + 'T00:00:00Z') - Date.parse(fromKey + 'T00:00:00Z')) / 86400000);
  }
  function weekdayOf(key) {
    return new Date(key + 'T12:00:00Z').getUTCDay(); // 0 Sun ... 6 Sat
  }
  function monthKey(key) {
    return key.slice(0, 7); // YYYY-MM
  }
  function dayLabel(key) {
    const d = new Date(key + 'T12:00:00Z');
    return d.toLocaleDateString('en-US', {
      timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric',
    }).toUpperCase();
  }
  function formatTime(iso) {
    return new Date(iso).toLocaleTimeString('en-US', {
      timeZone: 'America/Phoenix', hour: 'numeric', minute: '2-digit',
    });
  }
  function shortDateTime(iso) {
    return new Date(iso).toLocaleString('en-US', {
      timeZone: 'America/Phoenix', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    });
  }
  function priceLabel(e) {
    if (e.price_min === 0 && e.price_max === 0) return 'Free';
    if (e.price_min == null) return e.price_text;
    if (e.price_max != null && e.price_max !== e.price_min) return '$' + e.price_min + '–$' + e.price_max;
    return '$' + e.price_min;
  }

  const INSTAGRAM_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12s.015 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.666 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.988 8.74 24 12 24s3.667-.015 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.718 2.126-1.384.666-.667 1.079-1.335 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.28.072-1.687.072-4.947s-.015-3.667-.072-4.947c-.06-1.277-.262-2.149-.558-2.913-.306-.789-.718-1.459-1.384-2.126C21.319 1.347 20.651.935 19.86.63c-.765-.297-1.636-.499-2.913-.558C15.667.012 15.26 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 1.17.055 1.805.249 2.227.415.562.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.36 1.057.413 2.227.057 1.266.07 1.646.07 4.85s-.015 3.585-.074 4.85c-.061 1.17-.256 1.805-.421 2.227-.224.562-.479.96-.899 1.382-.419.419-.824.679-1.38.896-.42.164-1.065.36-2.235.413-1.274.057-1.649.07-4.859.07-3.211 0-3.586-.015-4.859-.074-1.171-.061-1.816-.256-2.236-.421-.569-.224-.96-.479-1.379-.899-.421-.419-.69-.824-.9-1.38-.165-.42-.36-1.065-.42-2.235-.045-1.26-.061-1.649-.061-4.844 0-3.196.016-3.586.061-4.861.06-1.17.255-1.814.42-2.234.21-.57.479-.96.9-1.381.419-.419.81-.689 1.379-.898.42-.166 1.051-.361 2.221-.421 1.275-.045 1.65-.06 4.859-.06l.045.03zm0 3.678c-3.405 0-6.162 2.76-6.162 6.162 0 3.405 2.76 6.162 6.162 6.162 3.405 0 6.162-2.76 6.162-6.162 0-3.405-2.76-6.162-6.162-6.162zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm7.846-10.405c0 .795-.646 1.44-1.44 1.44-.795 0-1.44-.646-1.44-1.44 0-.794.646-1.439 1.44-1.439.793-.001 1.44.645 1.44 1.439z"/></svg>';
  function instagramLink(handle) {
    if (!handle) return '';
    const url = 'https://instagram.com/' + handle.slice(1);
    return '<a class="instagram-link" href="' + url + '" target="_blank" rel="noreferrer" aria-label="View on Instagram" title="View on Instagram">' + INSTAGRAM_SVG + '</a>';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const GCAL_DEFAULT_DURATION_MS = 3 * 60 * 60 * 1000; // no stored end time, so default the block to 3 hours
  function gcalStamp(iso) {
    return new Date(iso).toISOString().replace(/[-:]|\.\d{3}/g, '');
  }
  function gcalUrl(e) {
    const start = new Date(e.starts_at);
    const end = new Date(start.getTime() + GCAL_DEFAULT_DURATION_MS);
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: e.title,
      dates: gcalStamp(start) + '/' + gcalStamp(end),
    });
    const location = [e.venue, e.address].filter(Boolean).join(', ');
    if (location) params.set('location', location);
    if (e.summary) params.set('details', e.summary);
    return 'https://www.google.com/calendar/render?' + params.toString();
  }

  // Hard cap regardless of animate-vs-static mode: a very wide scrolling
  // element (whether transformed for the marquee or just overflow-x: auto)
  // risks exceeding Chromium's ~16384px compositor layer/texture limit,
  // which doesn't throw — it silently blanks out rendering for the rest of
  // the page below it. 15 items comfortably stays well under that regardless
  // of title length, and is already more than a ticker is useful for reading.
  const TICKER_MAX_ITEMS = 15;

  function renderTicker() {
    const cutoff = Date.now() - 7 * 86400000;
    const recent = EVENTS
      .filter((e) => e.added_at && Date.parse(e.added_at) >= cutoff)
      .sort((a, b) => Date.parse(b.added_at) - Date.parse(a.added_at))
      .slice(0, TICKER_MAX_ITEMS);

    const ticker = document.getElementById('ticker');
    if (!recent.length) {
      ticker.style.display = 'none';
      return;
    }

    const itemsHtml = recent.map((e) =>
      '<a class="ticker-item" href="' + gcalUrl(e) + '" target="_blank" rel="noreferrer">'
        + escapeHtml(e.title)
        + ' <span class="ticker-sep">·</span> ' + escapeHtml(e.venue)
        + ' <span class="ticker-sep">·</span> ' + shortDateTime(e.starts_at)
        + '</a>'
    ).join('');

    const viewport = document.querySelector('.ticker-viewport');
    const track = document.getElementById('tickerTrack');

    // Measure one copy before deciding whether to animate: Chromium silently
    // fails to paint compositor layers past ~16384px wide, which a long
    // "added this week" list (e.g. right after a bulk reimport) can exceed.
    // When that's a risk, fall back to a plain swipeable strip instead of a
    // broken marquee rather than dropping any events off the list.
    track.innerHTML = itemsHtml;
    const TICKER_SAFE_WIDTH = 14000; // margin below the ~16384px compositor limit for the doubled (animated) track
    if (track.scrollWidth * 2 > TICKER_SAFE_WIDTH) {
      viewport.classList.add('ticker-viewport--static');
    } else {
      // Duplicated so the -50% transform loop wraps seamlessly.
      track.innerHTML = itemsHtml + itemsHtml;
      track.style.setProperty('--ticker-duration', Math.max(40, recent.length * 8) + 's');
    }
  }

  const els = {
    q: document.getElementById('q'),
    azToggle: document.getElementById('azToggle'),
    dateButtons: Array.from(document.querySelectorAll('.date-filters button')),
    venue: document.getElementById('venue'),
    genre: document.getElementById('genre'),
    results: document.getElementById('results'),
  };

  let azOnly = false;
  let dateFilter = '';
  // Keyed by YYYY-MM-DD so collapse state survives the full re-render that
  // every filter change triggers.
  const collapsedDays = new Set();

  // Delegated because render() replaces the whole results subtree.
  els.results.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.day-heading');
    if (!btn) return;
    const section = btn.closest('.day');
    const collapsed = !collapsedDays.has(btn.dataset.day);
    if (collapsed) collapsedDays.add(btn.dataset.day);
    else collapsedDays.delete(btn.dataset.day);
    section.classList.toggle('collapsed', collapsed);
    btn.setAttribute('aria-expanded', String(!collapsed));
    // Collapsing pulls everything below upward; if the day's top scrolled off,
    // pin it back under the header so the rail stays where it was tapped.
    const headerH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 0;
    if (section.getBoundingClientRect().top < headerH) {
      window.scrollTo({ top: section.offsetTop - headerH - 12 });
    }
  });

  function matchesDate(e, filter) {
    if (!filter) return true;
    const today = dayKey(new Date().toISOString());
    const key = dayKey(e.starts_at);
    const diff = daysBetween(today, key);
    if (diff < 0) return false;
    if (filter === 'today') return diff === 0;
    if (filter === 'tomorrow') return diff === 1;
    if (filter === 'weekend') return diff <= 6 && [0, 5, 6].includes(weekdayOf(key));
    if (filter === 'week') return diff <= 6;
    if (filter === 'month') return monthKey(key) === monthKey(today);
    return true;
  }

  function matches(e, q, venue, genre) {
    if (azOnly && !e.az_local) return false;
    if (!matchesDate(e, dateFilter)) return false;
    if (venue && e.venue !== venue) return false;
    if (genre && e.genre !== genre) return false;
    if (q) {
      const hay = [e.title, e.venue, ...(e.artists || []).map((a) => a.name)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function render() {
    const q = els.q.value.trim().toLowerCase();
    const venue = els.venue.value;
    const genre = els.genre.value;
    const filtered = EVENTS.filter((e) => matches(e, q, venue, genre));

    if (!filtered.length) {
      els.results.innerHTML = '<p class="empty">No events match.</p>';
      return;
    }

    // A festival's sets all carry the same festival name; show it once (as a
    // festival card, in place of its individual sets) at the position of the
    // earliest matching set rather than repeating the full lineup per set.
    const seenFestivals = new Set();
    const items = [];
    for (const e of filtered) {
      if (e.festival) {
        if (seenFestivals.has(e.festival)) continue;
        seenFestivals.add(e.festival);
      }
      items.push(e);
    }

    function festivalCardHtml(e) {
      const nameText = 'Festival :: ' + e.festival;
      const nameHtml = e.festival_ticket_url
        ? '<a href="' + e.festival_ticket_url + '" target="_blank" rel="noreferrer">' + escapeHtml(nameText) + '</a>'
        : escapeHtml(nameText);
      const dates = [e.festival_start_date, e.festival_end_date]
        .filter(Boolean)
        .map((d) => dayLabel(d))
        .join(' · ');
      const venuesHtml = e.festival_venues
        .map((v) => (v.url ? '<a href="' + v.url + '" target="_blank" rel="noreferrer">' + escapeHtml(v.name) + '</a>' : escapeHtml(v.name)))
        .join(' <span class="sep">·</span> ');
      const artistsHtml = e.festival_artists
        .map((a) => '<div class="festival-artist">' + escapeHtml(a.name) + (a.az_local ? '<span class="az-badge">AZ</span>' : '') + spotifyLink(a.spotify_artist_url) + instagramLink(a.instagram_handle) + '</div>')
        .join('');
      return '<article class="event festival-card">'
        + '<div class="main">'
        + '<h3 class="festival-name-line">' + nameHtml + (dates ? '<span class="festival-dates">· ' + dates + '</span>' : '') + '</h3>'
        + (venuesHtml ? '<p class="festival-venues">' + venuesHtml + '</p>' : '')
        + '<div class="festival-artists">' + artistsHtml + '</div>'
        + '</div>'
        + '</article>';
    }

    function eventCardHtml(e) {
      const price = priceLabel(e);
      const headlinerName = e.artists[0]?.name;
      const displayTitle = headlinerName && !e.title.toLowerCase().startsWith(headlinerName.toLowerCase())
        ? escapeHtml(e.title) + ' · ' + escapeHtml(headlinerName)
        : escapeHtml(e.title);
      return '<article class="event">'
        + '<div class="main">'
        + '<h3><span>' + displayTitle + '</span>' + (e.headliner_az_local ? '<span class="az-badge">AZ Local Band</span>' : '') + spotifyLink(e.headliner_spotify_url) + instagramLink(e.headliner_instagram_handle) + '</h3>'
        + '<p class="meta">' + (e.venue_url ? '<a class="venue-link" href="' + e.venue_url + '" target="_blank" rel="noreferrer">' + escapeHtml(e.venue) + '</a>' : escapeHtml(e.venue))
          + ' · ' + formatTime(e.starts_at)
          + (e.doors_at ? ' · Doors ' + formatTime(e.doors_at) : '')
          + (e.genre ? ' · ' + escapeHtml(e.genre) : '')
        + '</p>'
        + (e.summary ? '<p class="summary">' + escapeHtml(e.summary) + '</p>' : '')
        + (e.artists && e.artists.length > 1
            ? '<div class="guests"><p class="guests-label">Special Guests</p><ul class="guests-list">'
              + e.artists.slice(1).map((a) => '<li>' + escapeHtml(a.name) + (a.az_local ? '<span class="az-badge">AZ Local Band</span>' : '') + spotifyLink(a.spotify_artist_url) + instagramLink(a.instagram_handle) + '</li>').join('')
              + '</ul></div>'
            : '')
        + '</div>'
        + '<div class="side">'
        + (price ? '<span class="price">' + escapeHtml(price) + '</span>' : '')
        + (e.ticket_url ? '<a class="tickets" href="' + e.ticket_url + '" target="_blank" rel="noreferrer">Tickets</a>' : '')
        + '<a class="gcal" href="' + gcalUrl(e) + '" target="_blank" rel="noreferrer">Add to Calendar</a>'
        + '</div>'
        + '</article>';
    }

    // Group first so each day's rail can advertise its own event count, which
    // is the only thing left visible once the day is collapsed.
    const days = [];
    for (const e of items) {
      const key = dayKey(e.starts_at);
      if (!days.length || days[days.length - 1].key !== key) days.push({ key, events: [] });
      days[days.length - 1].events.push(e);
    }

    let html = '';
    for (const day of days) {
      const collapsed = collapsedDays.has(day.key);
      const n = day.events.length;
      html += '<section class="day' + (collapsed ? ' collapsed' : '') + '">'
        + '<h2 class="day-rail">'
        + '<button type="button" class="day-heading" data-day="' + day.key + '"'
        + ' aria-expanded="' + String(!collapsed) + '">'
        + dayLabel(day.key)
        + '<span class="day-count">' + n + ' event' + (n === 1 ? '' : 's') + '</span>'
        + '</button>'
        + '</h2>'
        + '<div class="day-events">'
        + day.events.map((e) => (e.festival ? festivalCardHtml(e) : eventCardHtml(e))).join('')
        + '</div>'
        + '</section>';
    }
    html += '<p class="count">' + filtered.length + ' of ' + EVENTS.length + ' events</p>';
    els.results.innerHTML = html;
  }

  function releaseDateLabel(date) {
    return new Date(date + 'T12:00:00Z')
      .toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' })
      .toUpperCase();
  }

  function renderReleases() {
    const panel = document.getElementById('releasesList');
    if (!RELEASES.length) {
      // A quiet week is normal, not an error state — say so rather than render blank.
      panel.innerHTML = '<p class="empty">No new local releases this week.</p>';
      return;
    }
    panel.innerHTML = RELEASES.map((r) =>
      '<article class="release">'
        // Cover art links to the same place as the Spotify icon — it is the
        // biggest tap target in the row, so it should not be inert. The anchor
        // carries the accessible name since the img itself is decorative.
        + '<a class="cover-link" href="' + r.spotify_url + '" target="_blank" rel="noreferrer"'
          + ' aria-label="Open ' + escapeHtml(r.name) + ' on Spotify">'
          + (r.cover ? '<img class="cover" src="' + r.cover + '" alt="" width="64" height="64" />' : '<div class="cover"></div>')
          + '</a>'
        + '<div class="release-main">'
        + '<h3>' + escapeHtml(r.name) + '</h3>'
        + '<p class="release-artist">' + escapeHtml(r.artists.join(' · ')) + spotifyLink(r.spotify_url) + '</p>'
        + '<p class="release-meta"><span class="type-badge">' + escapeHtml(r.album_type) + '</span> '
          + releaseDateLabel(r.release_date)
          + (r.total_tracks > 1 ? ' · ' + r.total_tracks + ' tracks' : '')
        + '</p>'
        + '</div>'
      + '</article>'
    ).join('');
  }

  // Tab switching. The date/venue/genre filters belong to Shows only — they
  // filter nothing here and would re-take the mobile header space.
  (function () {
    const tabShows = document.getElementById('tabShows');
    const tabReleases = document.getElementById('tabReleases');
    const showsFilters = document.getElementById('showsFilters');
    const showsPanel = document.getElementById('results');
    const releasesPanel = document.getElementById('releases');

    function select(showing) {
      const isShows = showing === 'shows';
      tabShows.classList.toggle('active', isShows);
      tabReleases.classList.toggle('active', !isShows);
      tabShows.setAttribute('aria-selected', String(isShows));
      tabReleases.setAttribute('aria-selected', String(!isShows));
      showsFilters.hidden = !isShows;
      showsPanel.hidden = !isShows;
      releasesPanel.hidden = isShows;
      window.scrollTo({ top: 0 });
    }
    tabShows.addEventListener('click', () => select('shows'));
    tabReleases.addEventListener('click', () => select('releases'));
  })();

  els.q.addEventListener('input', render);
  els.azToggle.addEventListener('click', () => {
    azOnly = !azOnly;
    els.azToggle.classList.toggle('active', azOnly);
    els.azToggle.setAttribute('aria-pressed', String(azOnly));
    render();
  });
  els.dateButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      dateFilter = dateFilter === btn.dataset.date ? '' : btn.dataset.date;
      els.dateButtons.forEach((b) => {
        const active = b.dataset.date === dateFilter;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', String(active));
      });
      render();
    });
  });
  els.venue.addEventListener('change', render);
  els.genre.addEventListener('change', render);
  render();
  renderReleases();
  // renderTicker(); // "Added This Week" scrolling footer — disabled for now, HTML above is commented out too
</script>
</body>
</html>
