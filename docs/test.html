<title>just us riffraff hanging out</title>
<script data-goatcounter="https://riffraff.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root {
    --charcoal: #141210;
    --offwhite: #F2EDE4;
    --amber: #FFB000;
    --violet: #6E5A7E;
    --sage: #8A9B8E;
    --dusk-blue: #7BA3C0;
    --bright-blue: #00BFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--charcoal);
    color: var(--offwhite);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, .display {
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  header {
    padding: 1.25rem 1.5rem 0.75rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: sticky;
    top: 0;
    background-color: rgba(20,18,16,0.85);
    z-index: 10;
    transition: transform .7s ease;
    will-change: transform;
  }
  header.header-hidden { transform: translateY(-100%); }
  header.header-hidden ~ main { --header-h: 0px; }
  header .inner { max-width: 900px; margin: 0 auto; }
  
  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 0 0.75rem;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    font-size: 1.2rem;
    color: var(--sage);
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.75rem; color: var(--offwhite); }
  
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
  }
  
  /* iOS Input Reset & 16px Scale Jump Protections */
  input[type="search"], select {
    -webkit-appearance: none;
    appearance: none;
    background: var(--charcoal);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--offwhite);
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 1rem; /* Locked at 16px to completely stop iOS forced zoom shifts */
    font-family: inherit;
  }
  
  input[type="search"] { flex: 1 1 220px; }
  input[type="search"]::placeholder { color: rgba(242,237,228,0.4); }
  select { flex: 0 0 auto; padding-right: 2rem; }
  input[type="search"]:focus, select:focus {
    outline: none;
    border-color: var(--amber);
  }

  /* GPU Composited Watermark Layer for iOS Safari */
  .watermark {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.95;
    transform: translateZ(0);
    will-change: transform;
  }
  .watermark svg { width: 100%; height: 90vh; }

  body.intro { overflow: hidden; }
  body.intro > header,
  body.intro > main,
  body.intro > .bottom-bar {
    opacity: 0;
    pointer-events: none;
  }
  body:not(.intro) > header,
  body:not(.intro) > main,
  body:not(.intro) > .bottom-bar {
    transition: opacity 3.5s ease-out;
  }
  body.intro .watermark { opacity: 1; }

  /* iOS Compliant CRT Core Animations — Bypassing broken inner SVG bounding boxes */
  .core-band {
    transform-origin: center center;
    will-change: transform, opacity;
  }
  body.intro .core-band { opacity: 0; }
  body.powering .core-band {
    animation: crt-core 1s ease-out forwards;
  }

  @keyframes crt-core {
    0%   { opacity: 0;   transform: scale(0, 1); }
    8%   { opacity: 1;   transform: scale(0.05, 1); }
    24%  { opacity: 1;   transform: scale(1, 1); }
    42%  { opacity: 0.6; transform: scale(1, 4); }
    68%  { opacity: 0.3; transform: scale(1, 0.8); }
    100% { opacity: 1;   transform: scale(1, 1); }
  }
</style>
</head>
<body class="intro">

  <header>
    <div class="inner">
      <div class="brand">RiffRaff</div>
      <h1>just us riffraff hanging out</h1>
      <div class="controls">
        <input type="search" placeholder="Search interactions..." aria-label="Search" />
        <select aria-label="Filter Options">
          <option>All Items</option>
          <option>Recent</option>
        </select>
      </div>
    </div>
  </header>

  <div class="watermark">
    <!-- Inline SVG asset container housing class="core-band" elements -->
    <svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
      <g class="core-band">
        <line x1="0" y1="300" x2="1200" y2="300" stroke="#FFB000" stroke-width="4" />
      </g>
    </svg>
  </div>

  <main>
    <!-- Content goes here -->
  </main>

  <script>
    // Safe DOM Activation sequence for mobile WebKit engines
    window.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('powering');
      setTimeout(() => {
        document.body.classList.remove('intro');
      }, 1100);
    });
  </script>
</body>
</html>
